<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>My Tiny Room</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 손글씨 폰트: 나눔손글씨 힘내라는 말보단 (네이버 한글한글 아름답게) -->
    <link rel="preconnect" href="https://hangeul.pstatic.net" crossorigin />
    <link href="https://hangeul.pstatic.net/hangeul_static/css/NanumHimNaeRaNeunMarBoDan.css" rel="stylesheet" />
  </head>
  <body>
    <!-- 3D 화면 -->
    <canvas id="webgl"></canvas>

    <!-- 로딩 인트로 -->
    <div id="loader" class="loader">
      <!-- 파비콘과 같은 집: 진행률에 맞춰 벽 → 문 → 지붕 순서로 그려지고 색이 채워져요 -->
      <svg class="loader__sketch" id="loader-sketch" viewBox="0 0 64 64" aria-hidden="true">
        <path class="loader__part" data-from="0" data-to="0.45" d="M14.5 28H49.5A2.5 2.5 0 0 1 52 30.5V56.5A2.5 2.5 0 0 1 49.5 59H14.5A2.5 2.5 0 0 1 12 56.5V30.5A2.5 2.5 0 0 1 14.5 28Z" fill="#fff1c2" stroke="#7a5640" stroke-width="2.2" />
        <path class="loader__part" data-from="0.45" data-to="0.65" d="M26 59V48a6 6 0 0 1 12 0V59Z" fill="#e3b07c" stroke="#7a5640" stroke-width="2" />
        <path class="loader__part" data-from="0.65" data-to="0.9" d="M5 31L32 7L59 31Z" fill="#ec6a52" stroke="#a8432f" stroke-width="2.2" />
      </svg>
      <p class="loader__text">방 그리는 중... <span id="loader-percent">0</span>%</p>
    </div>

    <!-- 화면 위 UI -->
    <div class="hud">
      <p class="hud__hint" id="hint">바닥을 누르면 걸어가요 · 드래그로 둘러보기</p>
    </div>
    <!-- 캐릭터 말풍선 (위치는 매 프레임 캐릭터 머리 위로 맞춰요) -->
    <div class="bubble" id="bubble" aria-live="polite"></div>

    <!-- 하단 채팅 · 인사 -->
    <div class="chat">
      <div class="chat__actions">
        <button id="wave" class="chat__icon" type="button" aria-label="손 흔들기" title="손 흔들기">👋</button>
        <button id="heart" class="chat__icon chat__icon--heart" type="button" aria-label="하트 날리기" title="하트 날리기">❤️</button>
      </div>
      <!-- onsubmit: 어떤 경우에도 폼 전송(새로고침)이 일어나지 않게 -->
      <form id="chat-form" class="chat__form" autocomplete="off" onsubmit="event.preventDefault()">
        <input id="chat-input" type="text" maxlength="60" placeholder="하고 싶은 말" aria-label="말풍선 메시지" />
        <button type="submit" class="chat__send" aria-label="보내기">↑</button>
      </form>
    </div>

    <div class="zoom">
      <button id="zoom-in" aria-label="확대">+</button>
      <button id="zoom-out" aria-label="축소">−</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
